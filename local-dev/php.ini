memory_limit = 1024M
max_execution_time = 600
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = Europe/Ljubljana
pdo_mysql.default_socket = ${PSS_ENV}/run/mysql.sock
mysqli.default_socket = ${PSS_ENV}/run/mysql.sock
sys_temp_dir = ${PSS_ENV}/tmp
upload_tmp_dir = ${PSS_ENV}/tmp
session.save_path = ${PSS_ENV}/tmp
opcache.enable = 1
opcache.enable_cli = 0
; Development store: surface every notice in the log.
error_reporting = E_ALL
error_log = ${PSS_ENV}/log/php.log
